<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👑 IGG VIP TOOL — Professional Dashboard</title>
  <style>
    :root {
      --bg-space: #050811;
      --card-bg: rgba(13, 18, 30, 0.92);
      --card-border: rgba(0, 240, 255, 0.2);
      
      --rgb-cyan: #00f0ff;
      --rgb-magenta: #ff007f;
      --rgb-purple: #a000ff;
      --rgb-gold: #ffd700;
      --rgb-green: #00ff88;
      
      --text-muted: #7b8fa9;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body {
      background: var(--bg-space);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ambient RGB Lighting Background */
    body::before {
      content: '';
      position: fixed;
      top: -20%; left: -20%;
      width: 140%; height: 140%;
      background: radial-gradient(circle at 20% 20%, rgba(0, 240, 255, 0.12), transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(255, 0, 127, 0.12), transparent 45%),
                  radial-gradient(circle at 50% 50%, rgba(160, 0, 255, 0.08), transparent 50%);
      z-index: -1;
      animation: rotateGlow 15s linear infinite alternate;
    }
    @keyframes rotateGlow {
      0% { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(10deg) scale(1.05); }
    }

    /* LOGIN SCREEN OVERLAY */
    #login-modal {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(4, 6, 12, 0.96);
      backdrop-filter: blur(15px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    #login-modal.hidden { display: none; }
    .login-card {
      width: 100%; max-width: 340px;
      background: var(--card-bg);
      border: 1px solid var(--rgb-cyan);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      text-align: center;
      position: relative; overflow: hidden;
    }
    .login-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--rgb-cyan), var(--rgb-magenta), var(--rgb-gold));
      animation: rgbSlide 3s linear infinite;
    }
    @keyframes rgbSlide { 0% { background-position: 0%; } 100% { background-position: 200%; } }
    .login-card h2 { color: var(--rgb-gold); font-size: 1.3rem; font-weight: 900; margin-bottom: 6px; }
    .login-card p { color: var(--text-muted); font-size: 0.78rem; margin-bottom: 18px; }
    
    .login-field {
      width: 100%; padding: 12px 14px; margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: var(--radius-md); color: #fff; font-size: 0.9rem; outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
      transition: all 0.2s;
    }
    .login-field:focus { border-color: var(--rgb-cyan); box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }
    
    .login-btn {
      width: 100%; padding: 12px; margin-top: 6px;
      background: linear-gradient(135deg, var(--rgb-cyan), var(--rgb-purple));
      border: none; border-radius: var(--radius-md); color: #000; font-weight: 900;
      font-size: 0.9rem; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transition: all 0.2s;
    }
    .login-btn:active { transform: scale(0.97); }
    .login-err { color: var(--rgb-magenta); font-size: 0.75rem; margin-top: 10px; font-weight: bold; min-height: 18px; }

    /* TOP HEADER BAR */
    .header-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 8px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .hamburger-btn {
      font-size: 1.3rem; color: var(--rgb-cyan); cursor: pointer;
      background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: var(--radius-sm); padding: 2px 8px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }
    .brand-title {
      font-size: 1.1rem; font-weight: 900;
      background: linear-gradient(135deg, #fff, var(--rgb-cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* 3D NEON CLOCK */
    .clock-3d-box {
      font-family: 'Consolas', monospace; font-size: 0.85rem; font-weight: 900;
      color: var(--rgb-cyan); background: rgba(0, 240, 255, 0.08);
      padding: 4px 10px; border-radius: var(--radius-md);
      border: 1px solid var(--rgb-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.5);
      text-shadow: 0 0 8px var(--rgb-cyan);
    }

    /* SIDEBAR DRAWER */
    .sidebar-drawer {
      position: fixed; top: 0; left: -280px; width: 270px; height: 100%;
      background: rgba(8, 12, 22, 0.98); border-right: 1px solid var(--rgb-cyan);
      box-shadow: 10px 0 30px rgba(0,0,0,0.9), 0 0 20px rgba(0, 240, 255, 0.2);
      backdrop-filter: blur(20px); z-index: 1000; transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 20px 16px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .sidebar-drawer.open { left: 0; }
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; display: none; backdrop-filter: blur(3px);
    }
    .sidebar-overlay.active { display: block; }
    .drawer-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; color: var(--rgb-gold); font-weight: 900; }
    .menu-links { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
    .menu-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-sm); color: #fff; font-weight: 700; text-decoration: none; cursor: pointer;
    }

    /* 4 SIDE-BY-SIDE VERTICAL CATEGORY CARDS WITH RGB GLOW */
    .categories-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; height: 68px;
    }
    .cat-card {
      background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md); padding: 6px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; cursor: pointer;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 4px 10px rgba(0, 0, 0, 0.6);
      transition: all 0.25s; position: relative; overflow: hidden;
    }
    .cat-card.active {
      border-color: var(--rgb-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.5);
      background: rgba(0, 240, 255, 0.1);
    }
    .cat-card.active::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--rgb-cyan), var(--rgb-magenta), var(--rgb-gold));
    }
    .cat-card .icon { font-size: 1.1rem; margin-bottom: 2px; }
    .cat-card .title { font-size: 0.62rem; font-weight: 900; text-transform: uppercase; color: var(--text-muted); }
    .cat-card.active .title { color: #fff; }

    /* MAIN CONTAINER (Fills space nicely, eliminates bottom gaps) */
    .features-container {
      flex: 1; display: flex; flex-direction: column; justify-content: space-between;
      gap: 10px; background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius-lg); padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative; overflow: hidden;
    }
    .category-section { display: none; flex-direction: column; gap: 8px; }
    .category-section.active { display: flex; }

    /* PROFESSIONAL RGB 3D FEATURE CARD BOXES */
    .3d-feature-card {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(6, 9, 18, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.18);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.1), 0 4px 12px rgba(0, 0, 0, 0.7);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .3d-feature-card:active {
      transform: scale(0.98);
      border-color: var(--rgb-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
    }
    .feature-left { display: flex; flex-direction: column; gap: 2px; }
    .feature-name {
      font-size: 0.72rem; font-weight: 900; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--rgb-cyan); display: flex; align-items: center; gap: 4px;
    }
    .feature-name.magenta { color: var(--rgb-magenta); }
    .feature-name.purple { color: var(--rgb-purple); }
    .feature-name.gold { color: var(--rgb-gold); }

    .feature-input {
      background: none; border: none; outline: none; color: #fff;
      font-size: 1rem; font-weight: 900; font-family: inherit; width: 140px;
    }

    /* RGB Glowing 3D Switch Box */
    .3d-toggle-box {
      width: 24px; height: 24px; border-radius: 6px;
      background: linear-gradient(135deg, var(--rgb-cyan), var(--rgb-purple));
      display: flex; align-items: center; justify-content: center;
      color: #000; font-size: 13px; font-weight: 900; cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5), inset 0 1px 1px rgba(255,255,255,0.6);
    }
    .3d-toggle-box.off { background: #182030; color: #4a5a73; box-shadow: none; }

    /* CONSOLE LOG INTEGRATED DIRECTLY AT THE BOTTOM OF CONTAINER */
    .integrated-console {
      background: #020409;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: var(--radius-md);
      padding: 10px;
      font-family: 'Consolas', monospace;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 240, 255, 0.1);
      margin-top: auto;
    }
    .console-header {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.68rem; color: var(--rgb-cyan); font-weight: bold;
      border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 4px; margin-bottom: 6px;
    }
    .console-logs {
      height: 90px; overflow-y: auto; font-size: 0.7rem; display: flex; flex-direction: column; gap: 4px;
    }
    .log-line { color: #7f90a7; }
    .log-line.success { color: var(--rgb-green); }
    .log-line.warn { color: var(--rgb-gold); }
    
    .console-input-row {
      display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.03);
      padding: 4px 8px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.08); margin-top: 6px;
    }
    .console-input-row span { color: var(--rgb-magenta); font-weight: bold; }
    .console-input-row input {
      width: 100%; background: none; border: none; outline: none; color: #fff; font-family: inherit; font-size: 0.72rem;
    }
  </style>
</head>
<body>

  <!-- MANDATORY LOGIN MODAL -->
  <div id="login-modal">
    <div class="login-card">
      <h2>👑 IGG VIP TOOL</h2>
      <p>Enter credentials to unlock dashboard access</p>
      <input type="text" id="login-user" class="login-field" placeholder="Username (IGG)">
      <input type="password" id="login-pass" class="login-field" placeholder="Password (1234)">
      <button class="login-btn" onclick="verifyLogin()">LOGIN TO DASHBOARD</button>
      <div id="login-err" class="login-err"></div>
    </div>
  </div>

  <!-- SIDEBAR DRAWER -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleDrawer()"></div>
  <div class="sidebar-drawer" id="sidebar-drawer">
    <div>
      <div class="drawer-header">
        <span>⚙️ OPTIONS & LINKS</span>
        <span style="cursor:pointer; color:var(--rgb-magenta);" onclick="toggleDrawer()">✕</span>
      </div>
      <div class="menu-links">
        <div class="menu-item" onclick="openSetting('Settings')">⚙️ Settings</div>
        <div class="menu-item" onclick="openSetting('Languages')">🌐 Languages</div>
        <a class="menu-item" href="https://youtube.com" target="_blank">▶️ YouTube Channel</a>
        <a class="menu-item" href="https://t.me" target="_blank">✈️ Telegram Support</a>
      </div>
    </div>
    <div class="menu-item" style="border-color:var(--rgb-magenta); color:var(--rgb-magenta);" onclick="logout()">
      🚪 Logout Tool
    </div>
  </div>

  <!-- TOP BAR HEADER -->
  <div class="header-bar">
    <div class="header-left">
      <div class="hamburger-btn" onclick="toggleDrawer()">☰</div>
      <div class="brand-title">👑 IGG VIP TOOL</div>
    </div>
    <div class="clock-3d-box" id="clock-3d">17:28:07</div>
  </div>

  <!-- 4 SIDE-BY-SIDE VERTICAL CATEGORY CARDS -->
  <div class="categories-row">
    <div class="cat-card active" onclick="selectCategory('cat-dash', this)">
      <div class="icon">🏠</div>
      <div class="title">Dashboard</div>
    </div>
    <div class="cat-card" onclick="selectCategory('cat-custom', this)">
      <div class="icon">👑</div>
      <div class="title">Custom</div>
    </div>
    <div class="cat-card" onclick="selectCategory('cat-gameplay', this)">
      <div class="icon">🧩</div>
      <div class="title">Gameplay</div>
    </div>
    <div class="cat-card" onclick="selectCategory('cat-supplies', this)">
      <div class="icon">🛒</div>
      <div class="title">Supplies</div>
    </div>
  </div>
