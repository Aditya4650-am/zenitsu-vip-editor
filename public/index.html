<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👑 IGG VIP TOOL — Ultimate Township VIP Control Center</title>
  
  <style>
    /* ==========================================================================
       1. CSS VARIABLES & THEMING SYSTEM
       ========================================================================== */
    :root {
      --bg-deep-space: #03050d;
      --bg-glass: rgba(13, 17, 33, 0.7);
      --bg-glass-hover: rgba(22, 29, 56, 0.85);
      
      --primary-rgb: 0, 240, 255;
      --primary: rgb(var(--primary-rgb));
      --secondary-rgb: 255, 0, 127;
      --secondary: rgb(var(--secondary-rgb));
      --accent-rgb: 123, 31, 162;
      --accent: rgb(var(--accent-rgb));
      
      --neon-gold: #ffd700;
      --neon-green: #00ff88;
      --neon-red: #ff3366;
      
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      
      --border-glass: rgba(255, 255, 255, 0.12);
      --border-neon: rgba(var(--primary-rgb), 0.5);
      
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "Consolas", "Courier New", Courier, monospace;
      
      --glow-primary: 0 0 20px rgba(var(--primary-rgb), 0.4);
      --glow-secondary: 0 0 20px rgba(var(--secondary-rgb), 0.4);
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-deep-space);
      color: var(--text-main);
      font-family: var(--font-main);
      overflow-x: hidden;
      font-size: 14px;
      line-height: 1.5;
    }

    input, button, select {
      font-family: inherit;
      color: inherit;
      outline: none;
      border: none;
      background: none;
    }

    input[type="text"], input[type="password"], input[type="number"] {
      font-size: 16px !important;
      user-select: text;
    }

    /* BACKGROUND ANIMATIONS */
    .aurora-bg {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(var(--primary-rgb), 0.15), transparent 40%),
                  radial-gradient(circle at 80% 20%, rgba(var(--secondary-rgb), 0.12), transparent 35%);
      animation: auroraRotate 30s linear infinite;
    }

    @keyframes auroraRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* LOGIN OVERLAY */
    #login-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(3, 5, 13, 0.95);
      backdrop-filter: blur(20px);
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #login-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 400px;
      padding: 35px 28px;
      background: rgba(13, 17, 33, 0.9);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glass);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), var(--glow-primary);
      text-align: center;
    }

    .login-header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      color: #fff;
      transition: var(--transition-fast);
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(var(--primary-rgb), 0.3);
    }

    .btn-login {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: var(--glow-primary);
      transition: var(--transition-fast);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .login-error {
      margin-top: 12px;
      color: var(--neon-red);
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 20px;
    }

    /* MAIN APP STYLES */
    #app-container {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: rgba(3, 5, 13, 0.8);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border-glass);
    }

    .brand-title h2 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
    }

    .brand-title p {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .clock-time {
      font-family: var(--font-mono);
      font-size: 1rem;
      color: var(--neon-gold);
    }

    main {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .vip-card {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 20px;
    }

    .btn-action {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: var(--radius-sm);
      background: rgba(var(--primary-rgb), 0.2);
      border: 1px solid var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="aurora-bg"></div>

  <!-- LOGIN OVERLAY -->
  <div id="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <h1>👑 IGG VIP TOOL</h1>
        <p>Township VIP Control Center</p>
      </div>
      <div class="input-group">
        <label>VIP Passkey</label>
        <div class="input-wrapper">
          <input type="password" id="passkey-input" placeholder="Enter VIP Passkey (e.g. 1234)">
        </div>
      </div>
      <button class="btn-login" id="btn-login-submit">UNLOCK DASHBOARD</button>
      <div class="login-error" id="login-error-msg"></div>
    </div>
  </div>
  
  <!-- MAIN APP CONTAINER -->
  <div id="app-container">
    <header>
      <div class="brand-title">
        <h2>👑 IGG VIP TOOL</h2>
        <p>Township VIP Control Center</p>
      </div>
      <div class="clock-time" id="clock-time">00:00:00</div>
    </header>

    <main>
      <h3 style="color: #fff; margin-bottom: 15px;">✨ VIP Dashboard Controls</h3>
      
      <div class="grid-container">
        <!-- Card 1: Coins -->
        <div class="vip-card">
          <h4>🪙 Township Coins</h4>
          <p style="color: var(--text-muted); font-size: 0.8rem; margin: 8px 0;">Inject resources directly</p>
          <input type="number" id="coin-val" value="999999" style="width:100%; padding:8px; background:rgba(0,0,0,0.4); border:1px solid var(--border-glass); border-radius:6px; color:var(--neon-gold); text-align:center; font-family:var(--font-mono);">
          <button class="btn-action" onclick="applyFeature('Coins')">Apply Coins</button>
        </div>

        <!-- Card 2: Cash / T-Cash -->
        <div class="vip-card">
          <h4>💵 Township Cash</h4>
          <p style="color: var(--text-muted); font-size: 0.8rem; margin: 8px 0;">Inject premium currency</p>
          <input type="number" id="cash-val" value="50000" style="width:100%; padding:8px; background:rgba(0,0,0,0.4); border:1px solid var(--border-glass); border-radius:6px; color:var(--neon-gold); text-align:center; font-family:var(--font-mono);">
          <button class="btn-action" onclick="applyFeature('T-Cash')">Apply Cash</button>
        </div>

        <!-- Card 3: Instant Speedup -->
        <div class="vip-card">
          <h4>⚡ Instant Speedup</h4>
          <p style="color: var(--text-muted); font-size: 0.8rem; margin: 8px 0;">Bypass timers & queues</p>
          <button class="btn-action" onclick="applyFeature('Speedup Mode')">Enable Speedup</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Live Clock Function
    function updateClock() {
      const now = new Date();
      document.getElementById('clock-time').textContent = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Login Verification Logic
    const VALID_PASSKEYS = ["1234", "VIP2026", "admin", "igg"];
    const loginOverlay = document.getElementById('login-overlay');
    const passkeyInput = document.getElementById('passkey-input');
    const loginBtn = document.getElementById('btn-login-submit');
    const errorMsg = document.getElementById('login-error-msg');

    function unlockDashboard() {
      const inputPass = passkeyInput.value.trim();

      if (!inputPass) {
        errorMsg.textContent = "⚠️ Please enter a passkey!";
        return;
      }

      if (VALID_PASSKEYS.includes(inputPass.toLowerCase())) {
        errorMsg.style.color = "var(--neon-green)";
        errorMsg.textContent = "✔ Access Granted! Redirecting...";
        
        setTimeout(() => {
          loginOverlay.classList.add('hidden');
        }, 500);
      } else {
        errorMsg.style.color = "var(--neon-red)";
        errorMsg.textContent = "❌ Invalid Passkey! Try: 1234";
        passkeyInput.value = "";
        passkeyInput.focus();
      }
    }

    // Trigger on button click
    loginBtn.addEventListener('click', unlockDashboard);

    // Trigger on "Enter" key press
    passkeyInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        unlockDashboard();
      }
    });

    // Dashboard Action Function
    function applyFeature(featureName) {
      alert('⚡ ' + featureName + ' activated successfully!');
    }
  </script>
</body>
</html>
