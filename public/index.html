<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITSU VIP Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #0b0c10;
            --card-base: #141622;
            --card-border: #232738;
            --neon-blue: #00e5ff;
            --neon-purple: #ba55d3;
            --neon-gold: #fbbf24;
            --neon-pink: #ff0055;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            font-family: ui-sans-serif, system-ui, sans-serif;
            perspective: 1000px;
        }

        /* Realistic 3D Box & Container Effects */
        .card-3d {
            background: linear-gradient(160deg, #1c1f30 0%, #11121c 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 10px 20px -5px rgba(0, 0, 0, 0.7),
                0 4px 6px -2px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.15),
                inset 0 -2px 4px 0 rgba(0, 0, 0, 0.6);
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
            transform-style: preserve-3d;
        }

        .card-3d:hover {
            transform: translateY(-3px) rotateX(3deg);
            box-shadow: 
                0 15px 25px -5px rgba(0, 0, 0, 0.8),
                0 8px 10px -2px rgba(0, 0, 0, 0.6),
                inset 0 1px 2px 0 rgba(255, 255, 255, 0.25);
        }

        /* 3D Interactive Buttons */
        .btn-3d-connect {
            background: linear-gradient(180deg, rgba(0, 229, 255, 0.25) 0%, rgba(0, 150, 200, 0.05) 100%);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 4px 12px rgba(0, 229, 255, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.15s ease-in-out;
        }
        .btn-3d-connect:hover {
            background: linear-gradient(180deg, rgba(0, 229, 255, 0.4) 0%, rgba(0, 180, 230, 0.15) 100%);
            box-shadow: 0 6px 18px rgba(0, 229, 255, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }
        .btn-3d-connect:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(0, 229, 255, 0.2), inset 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .btn-3d-apply {
            background: linear-gradient(180deg, rgba(186, 85, 211, 0.25) 0%, rgba(120, 40, 140, 0.05) 100%);
            border: 1px solid var(--neon-purple);
            color: var(--neon-purple);
            box-shadow: 0 4px 12px rgba(186, 85, 211, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.15s ease-in-out;
        }
        .btn-3d-apply:hover {
            background: linear-gradient(180deg, rgba(186, 85, 211, 0.4) 0%, rgba(140, 50, 160, 0.15) 100%);
            box-shadow: 0 6px 18px rgba(186, 85, 211, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }
        .btn-3d-apply:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(186, 85, 211, 0.2), inset 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .btn-3d-pink {
            background: linear-gradient(180deg, #ff2a75 0%, #bb0038 100%);
            border: 1px solid #ff5588;
            box-shadow: 0 6px 16px rgba(255, 0, 85, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.15s ease-in-out;
        }
        .btn-3d-pink:hover {
            background: linear-gradient(180deg, #ff4488 0%, #dd0044 100%);
            box-shadow: 0 8px 22px rgba(255, 0, 85, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }
        .btn-3d-pink:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(255, 0, 85, 0.3), inset 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* 3D Tab Styles */
        .tab-btn {
            background: linear-gradient(180deg, #181a28 0%, #0e0f17 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .active-tab {
            background: linear-gradient(180deg, #282c44 0%, #181a29 100%);
            border-top: 2px solid var(--neon-pink);
            border-bottom: 1px solid transparent;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 0, 85, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        /* Drawer Slide & Glass Depth */
        .drawer-slide { 
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .glass-modal { 
            background: rgba(16, 18, 28, 0.92); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        /* Inputs 3D Inset */
        .input-3d {
            background: linear-gradient(180deg, #090a0f 0%, #11131c 100%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <!-- OVERLAY & SIDE DRAWER (MENU) -->
    <div id="drawer-overlay" onclick="toggleMenu()" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-40"></div>
    <div id="side-drawer" class="fixed top-0 left-0 h-full w-4/5 max-w-xs card-3d z-50 transform -translate-x-full drawer-slide p-5 flex flex-col justify-between overflow-y-auto">
        <div>
            <!-- Drawer Header -->
            <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-tr from-amber-500 to-yellow-300 rounded-xl flex items-center justify-center font-extrabold text-xl text-black shadow-lg shadow-yellow-500/30 border border-yellow-200">Z</div>
                    <div>
                        <h2 class="font-extrabold text-lg leading-none tracking-wide text-yellow-400">TsVip</h2>
                        <span class="text-[10px] text-gray-400 font-mono">SAVE EDITOR</span>
                    </div>
                </div>
                <button onclick="toggleMenu()" class="text-gray-400 hover:text-white text-xl font-bold p-1">✕</button>
            </div>

            <!-- Language Switcher Grid (Supports EN, PT, ES, HI, ID, VI, RU, FR) -->
            <div class="mb-6">
                <span class="text-xs font-semibold text-gray-400 mb-2.5 block flex items-center gap-1.5">🌐 <span data-i18n="lang_title">Language</span></span>
                <div class="grid grid-cols-4 gap-2 text-xs text-center font-semibold" id="lang-grid">
                    <button onclick="setLanguage('en')" id="lang-en" class="p-2 rounded-lg bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 shadow-sm">EN</button>
                    <button onclick="setLanguage('pt')" id="lang-pt" class="p-2 rounded-lg input-3d text-gray-400 hover:text-white">PT</button>
                    <button onclick="setLanguage('es')" id="lang-es" class="p-2 rounded-lg input-3d text-gray-400 hover:text-white">ES</button>
                    <button onclick="setLanguage('hi')" id="lang-hi" class="p-2 rounded-lg input-3d text-gray-400 hover:text-white">HI</button>
                    <button onclick="setLanguage('id')" id="lang-id" class="p-2 rounded-lg input-3d text-gray-400 hover:text-white">ID</button>
                    <button onclick="setLanguage('vi')" id="lang-vi" class="p-2 rounded-lg input-3d text-gray-400 hover:text-white">VI</button>
                    <button onclick="setLanguage('ru')" id="lang-ru" class="p-2 rounded-lg input-3d text-gray-400 hover:text-white">RU</button>
                    <button onclick="setLanguage('fr')" id="lang-fr" class="p-2 rounded-lg input-3d text-gray-400 hover:text-white">FR</button>
                </div>
            </div>

            <!-- Menu Navigation Links -->
            <div class="space-y-2 text-sm font-semibold">
                <button onclick="openModal('modal-settings')" class="w-full flex items-center gap-3 text-gray-300 hover:bg-white/5 p-2.5 rounded-xl transition input-3d"><span class="text-indigo-400">⚙️</span> <span data-i18n="menu_settings">Settings</span></button>
                <button onclick="openModal('modal-account')" class="w-full flex items-center gap-3 text-gray-300 hover:bg-white/5 p-2.5 rounded-xl transition input-3d"><span class="text-blue-400">👤</span> <span data-i18n="menu_account">My Account</span></button>
                <button onclick="openModal('modal-guide')" class="w-full flex items-center gap-3 text-gray-300 hover:bg-white/5 p-2.5 rounded-xl transition input-3d"><span class="text-teal-400">📖</span> <span data-i18n="menu_guide">User Guide</span></button>
                <button onclick="openModal('modal-share')" class="w-full flex items-center gap-3 text-gray-300 hover:bg-white/5 p-2.5 rounded-xl transition input-3d"><span class="text-green-400">🔗</span> <span data-i18n="menu_share">Share App</span></button>
                <button onclick="openModal('modal-feedback')" class="w-full flex items-center gap-3 text-gray-300 hover:bg-white/5 p-2.5 rounded-xl transition input-3d"><span class="text-pink-400">💬</span> <span data-i18n="menu_feedback">Feedback</span></button>
                <button onclick="openModal('modal-about')" class="w-full flex items-center gap-3 text-gray-300 hover:bg-white/5 p-2.5 rounded-xl transition input-3d"><span class="text-cyan-400">ℹ️</span> <span data-i18n="menu_about">About App</span></button>
            </div>
        </div>

        <!-- Menu Footer -->
        <div class="pt-6 border-t border-gray-800/80 space-y-2 text-sm font-semibold">
            <button onclick="actionLogout()" class="w-full flex items-center gap-3 text-pink-500 hover:bg-pink-500/10 p-2.5 rounded-xl transition input-3d"><span>🚪</span> <span data-i18n="menu_logout">Logout</span></button>
            <button onclick="actionExit()" class="w-full flex items-center gap-3 text-yellow-400 hover:bg-white/5 p-2.5 rounded-xl transition input-3d"><span>⚡</span> <span data-i18n="menu_exit">Exit</span></button>
            <div class="text-center text-[10px] text-gray-500 pt-2 font-mono">TsVip Engine v1.30-FIX-5</div>
        </div>
    </div>

    <!-- MAIN DASHBOARD CONTENT -->
    <div>
        <!-- Top App Bar -->
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-amber-500 to-yellow-300 rounded-2xl flex items-center justify-center font-black text-xl text-black shadow-lg shadow-yellow-500/20 border border-yellow-200">Z</div>
                <div>
                    <h1 class="font-extrabold text-lg leading-none text-yellow-400 tracking-wide">ZENITSU VIP</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-[10px] text-gray-400 font-mono">v1.30-FIX-5</span>
                        <span class="text-[10px] bg-emerald-900/60 text-emerald-400 px-2 py-0.5 rounded-full font-mono font-bold border border-emerald-500/30">&lt;&gt; CONNECTED</span>
                    </div>
                    <div class="text-[10px] text-yellow-400/90 font-mono font-semibold mt-1" id="ist-clock">🇮🇳 IST: Loading...</div>
                </div>
            </div>
            <button onclick="toggleMenu()" class="p-2 text-gray-400 hover:text-white text-xl">⋮</button>
        </div>

        <!-- Target File Picker -->
        <div class="card-3d p-3 rounded-2xl mb-4">
            <label class="block text-[10px] font-bold text-gray-400 mb-1 tracking-wider uppercase" data-i18n="label_file">GAME SAVE FILE TARGET</label>
            <input type="file" id="saveFileInput" accept=".xml,.bin" class="block w-full text-xs text-gray-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-yellow-500/20 file:text-yellow-300 cursor-pointer">
        </div>

        <!-- Action Control Buttons -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <button onclick="triggerConnect()" class="btn-3d-connect p-3 rounded-2xl font-bold text-xs flex flex-col items-center gap-1">
                <span class="text-[10px] text-gray-300 font-normal" data-i18n="btn_sub_connect">🚀 Start Edit Game</span>
                <span data-i18n="btn_connect">CONNECT</span>
            </button>
            <button onclick="submitSaveProcess()" class="btn-3d-apply p-3 rounded-2xl font-bold text-xs flex flex-col items-center gap-1">
                <span class="text-[10px] text-gray-300 font-normal" data-i18n="btn_sub_apply">💾 Save and launch</span>
                <span data-i18n="btn_apply">APPLY</span>
            </button>
        </div>

        <!-- Tab Bar -->
        <div class="flex card-3d p-1 rounded-2xl mb-4 text-[11px] font-bold text-gray-400 justify-between gap-1">
            <button onclick="switchTab('stats')" id="tab-stats" class="w-1/5 py-2.5 rounded-xl active-tab tab-btn flex flex-col items-center gap-1"><span>✔️</span><span data-i18n="tab_stats">STATS</span></button>
            <button onclick="switchTab('unlocks')" id="tab-unlocks" class="w-1/5 py-2.5 rounded-xl tab-btn flex flex-col items-center gap-1"><span>🔓</span><span data-i18n="tab_unlocks">UNLOCKS</span></button>
            <button onclick="switchTab('tools')" id="tab-tools" class="w-1/5 py-2.5 rounded-xl tab-btn flex flex-col items-center gap-1"><span>🔧</span><span data-i18n="tab_tools">TOOLS</span></button>
            <button onclick="switchTab('regatta')" id="tab-regatta" class="w-1/5 py-2.5 rounded-xl tab-btn flex flex-col items-center gap-1"><span>⛵</span><span data-i18n="tab_regatta">REGATTA</span></button>
            <button onclick="switchTab('vip')" id="tab-vip" class="w-1/5 py-2.5 rounded-xl tab-btn flex flex-col items-center gap-1"><span>💎</span><span data-i18n="tab_vip">VIP</span></button>
        </div>

        <!-- TAB 1: STATS PANEL -->
        <div id="panel-stats" class="grid grid-cols-2 gap-3 mb-4">
            <div class="card-3d p-3 rounded-2xl relative">
                <div class="flex justify-between items-center mb-1"><span class="text-xs text-yellow-500 font-bold">💰 T-CASH</span><input type="checkbox" id="chk-tcash" checked class="accent-yellow-500"></div>
                <input type="number" id="tcash" value="99689267" class="w-full bg-transparent font-black text-lg outline-none text-white">
            </div>
            <div class="card-3d p-3 rounded-2xl relative">
                <div class="flex justify-between items-center mb-1"><span class="text-xs text-yellow-600 font-bold">🪙 COINS</span><input type="checkbox" id="chk-coins" checked class="accent-yellow-600"></div>
                <input type="number" id="coins" value="1809119" class="w-full bg-transparent font-black text-lg outline-none text-white">
            </div>
            <div class="card-3d p-3 rounded-2xl relative">
                <div class="flex justify-between items-center mb-1"><span class="text-xs text-cyan-400 font-bold">⭐ LEVEL</span><input type="checkbox" id="chk-level" checked class="accent-cyan-400"></div>
                <input type="number" id="level" value="1090" class="w-full bg-transparent font-black text-lg outline-none text-white">
            </div>
            <div class="card-3d p-3 rounded-2xl relative">
                <div class="flex justify-between items-center mb-1"><span class="text-xs text-purple-400 font-bold">🧩 M3 LVL</span><input type="checkbox" id="chk-m3lvl" checked class="accent-purple-400"></div>
                <input type="number" id="m3lvl" value="10000" class="w-full bg-transparent font-black text-lg outline-none text-white">
            </div>
            <div class="card-3d p-3 rounded-2xl relative">
                <div class="flex justify-between items-center mb-1"><span class="text-xs text-blue-400 font-bold">🏅 1ST WIN</span><input type="checkbox" id="chk-firstwin" checked class="accent-blue-400"></div>
                <input type="number" id="firstwin" value="8121" class="w-full bg-transparent font-black text-lg outline-none text-white">
            </div>
            <div class="card-3d p-3 rounded-2xl relative">
                <div class="flex justify-between items-center mb-1"><span class="text-xs text-pink-500 font-bold">❤️ LIVES</span><input type="checkbox" id="chk-lives" checked class="accent-pink-500"></div>
                <input type="number" id="lives" value="5629" class="w-full bg-transparent font-black text-lg outline-none text-white">
            </div>
            <div class="card-3d p-3 rounded-2xl relative">
                <div class="flex justify-between items-center mb-1"><span class="text-xs text-teal-400 font-bold">🤝 HELP</span><input type="checkbox" id="chk-help" checked class="accent-teal-400"></div>
                <input type="number" id="help" value="55090" class="w-full bg-transparent font-black text-lg outline-none text-white">
            </div>
            <div class="card-3d p-3 rounded-2xl relative">
                <div class="flex justify-between items-center mb-1"><span class="text-xs text-indigo-400 font-bold">🎴 CARDS</span><input type="checkbox" id="chk-cards" checked class="accent-indigo-400"></div>
                <input type="number" id="cards" value="16" class="w-full bg-transparent font-black text-lg outline-none text-white">
            </div>
        </div>

        <!-- TAB 2: UNLOCKS PANEL -->
        <div id="panel-unlocks" class="hidden card-3d p-4 rounded-2xl mb-4 space-y-3">
            <h2 class="font-bold text-sm text-purple-400 mb-2" data-i18n="unlocks_title">Township Game Unlocks</h2>
            <label class="flex justify-between items-center input-3d p-3 rounded-xl cursor-pointer">
                <span class="text-xs font-semibold" data-i18n="unlock_buildings">🏢 Unlock All Buildings & Factories</span>
                <input type="checkbox" id="chk-unlock-buildings" class="accent-purple-500">
            </label>
            <label class="flex justify-between items-center input-3d p-3 rounded-xl cursor-pointer">
                <span class="text-xs font-semibold" data-i18n="unlock_expansions">🗺️ Unlock All Land Expansions</span>
                <input type="checkbox" id="chk-unlock-expansions" class="accent-purple-500">
            </label>
            <label class="flex justify-between items-center input-3d p-3 rounded-xl cursor-pointer">
                <span class="text-xs font-semibold" data-i18n="unlock_skins">🎨 Unlock All Town Skins & Sets</span>
                <input type="checkbox" id="chk-unlock-skins" class="accent-purple-500">
            </label>
        </div>

        <!-- TAB 3: TOOLS PANEL -->
        <div id="panel-tools" class="hidden card-3d p-4 rounded-2xl mb-4 space-y-3">
            <h2 class="font-bold text-sm text-cyan-400 mb-2" data-i18n="tools_title">Save Integrity Tools</h2>
            <label class="flex justify-between items-center input-3d p-3 rounded-xl cursor-pointer">
                <span class="text-xs font-semibold" data-i18n="tool_antiban">🛡️ Enable Anti-Ban Protection Bypass</span>
                <input type="checkbox" id="chk-tool-antiban" checked class="accent-cyan-400">
            </label>
            <label class="flex justify-between items-center input-3d p-3 rounded-xl cursor-pointer">
                <span class="text-xs font-semibold" data-i18n="tool_instant">⚡ Instant Factory Production
