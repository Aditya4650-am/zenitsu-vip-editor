<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👑 IGG VIP TOOL — Township Control Center</title>
  <style>
    :root {
      --bg-main: #0a0d14;
      --card-bg: #121722;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-gold: #ffcc00;
      --cyan-btn: #00f0ff;
      --purple-btn: #d000ff;
      --pink-btn: #ff007f;
      --text-muted: #8592a6;
      --text-white: #ffffff;
      --radius-sm: 8px;
      --radius-md: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    body { background: var(--bg-main); color: var(--text-white); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; font-size: 14px; }

    /* Login Screen */
    #login-overlay {
      position: fixed; inset: 0; z-index: 999; background: var(--bg-main);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    #login-overlay.hidden { display: none; }
    .login-box {
      width: 100%; max-width: 360px; padding: 25px; background: var(--card-bg);
      border: 1px solid var(--card-border); border-radius: var(--radius-md); text-align: center;
    }
    .login-box input {
      width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border);
      border-radius: var(--radius-sm); color: var(--primary-gold); font-size: 1rem; text-align: center; margin: 15px 0; outline: none;
    }
    .login-btn {
      width: 100%; padding: 12px; background: linear-gradient(135deg, var(--cyan-btn), var(--purple-btn));
      border: none; border-radius: var(--radius-sm); color: #fff; font-weight: bold; cursor: pointer;
    }

    /* Top Bar */
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .top-bar h2 { font-size: 1.2rem; color: var(--primary-gold); font-weight: 800; letter-spacing: 0.5px; }
    .clock-time { font-family: monospace; font-size: 0.95rem; color: var(--cyan-btn); }

    /* Category Section Headers */
    .cat-title {
      font-size: 0.85rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 1px; margin: 20px 0 10px 0; border-bottom: 1px solid var(--card-border); padding-bottom: 5px;
    }
    .cat-title:first-of-type { margin-top: 0; }

    /* Features Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

    /* Card Box Style */
    .feature-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md);
      padding: 12px 14px; position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 85px;
    }
    .card-title {
      font-size: 0.72rem; font-weight: 800; color: var(--primary-gold);
      display: flex; align-items: center; gap: 4px; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .card-title.cyan { color: var(--cyan-btn); }
    .card-title.purple { color: var(--purple-btn); }
    .card-title.pink { color: var(--pink-btn); }

    .card-val-input {
      font-size: 1.15rem; font-weight: 800; color: #fff; background: none; border: none;
      width: 100%; outline: none; margin-top: 6px; font-family: inherit;
    }

    .card-toggle {
      position: absolute; top: 10px; right: 10px; width: 18px; height: 18px;
      border-radius: 4px; background: var(--primary-gold); display: flex; align-items: center;
      justify-content: center; color: #000; font-size: 11px; font-weight: bold; cursor: pointer;
    }
    .card-toggle.cyan { background: var(--cyan-btn); }
    .card-toggle.purple { background: var(--purple-btn); }
    .card-toggle.pink { background: var(--pink-btn); }
  </style>
</head>
<body>

  <!-- LOGIN OVERLAY -->
  <div id="login-overlay">
    <div class="login-box">
      <h2 style="color:var(--primary-gold);">👑 IGG VIP TOOL</h2>
      <p style="color:var(--text-muted); font-size:0.8rem; margin-top:4px;">Township VIP Control Center</p>
      <input type="password" id="passkey" placeholder="Passkey (e.g. 1234)">
      <button class="login-btn" onclick="login()">UNLOCK DASHBOARD</button>
      <div id="login-err" style="color:#ff3366; font-size:0.8rem; margin-top:10px;"></div>
    </div>
  </div>

  <!-- TOP HEADER -->
  <div class="top-bar">
    <h2>👑 IGG VIP TOOL</h2>
    <div class="clock-time" id="live-clock">00:00:00</div>
  </div>

  <!-- DASHBOARD & CURRENCIES -->
  <div class="cat-title">🏠 Dashboard & Currencies</div>
  <div class="grid">
    <div class="feature-card">
      <div class="card-title">🪙 Coins</div>
      <input class="card-val-input" type="number" value="1809119">
      <div class="card-toggle" onclick="toggleCard(this)">✓</div>
    </div>
    <div class="feature-card">
      <div class="card-title cyan">💵 TCash</div>
      <input class="card-val-input" type="number" value="99689267">
      <div class="card-toggle cyan" onclick="toggleCard(this)">✓</div>
    </div>
    <div class="feature-card">
      <div class="card-title purple">💎 VIP Features</div>
      <input class="card-val-input" type="text" value="LEVEL 10" readonly>
      <div class="card-toggle purple" onclick="toggleCard(this)">✓</div>
    </div>
  </div>

  <!-- CUSTOMIZATION & STYLING -->
  <div class="cat-title">👑 Customization & Rewards</div>
  <div class="grid">
    <div class="feature-card">
      <div class="card-title">👑 Skins</div>
      <input class="card-val-input" type="text" value="UNLOCKED" readonly>
      <div class="card-toggle" onclick="toggleCard(this)">✓</div>
    </div>
    <div class="feature-card">
      <div class="card-title purple">🏅 Badges</div>
      <input class="card-val-input" type="text" value="VIP BADGES" readonly>
      <div class="card-toggle purple" onclick="toggleCard(this)">✓</div>
    </div>
    <div class="feature-card">
      <div class="card-title cyan">🎨 Style</div>
      <input class="card-val-input" type="text" value="RGB AURA" readonly>
      <div class="card-toggle cyan" onclick="toggleCard(this)">✓</div>
    </div>
    <div class="feature-card">
      <div class="card-title pink">🖼️ Frames</div>
      <input class="card-val-input" type="text" value="ALL FRAMES" readonly>
      <div class="card-toggle pink" onclick="toggleCard(this)">✓</div>
    </div>
    <div class="feature-card">
      <div class="card-title">✨ Decoration</div>
      <input class="card-val-input" type="text" value="EVENT DECOR" readonly>
      <div class="card-toggle" onclick="toggleCard(this)">✓</div>
    </div>
  </div>
