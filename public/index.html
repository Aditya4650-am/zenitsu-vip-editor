<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👑 IGG VIP TOOL — Ultimate Township VIP Control Center</title>
  
  <style>
    /* ==========================================================================
       1. CSS VARIABLES & THEMING SYSTEM
       ========================================================================== */
    :root {
      --bg-deep-space: #03050d;
      --bg-glass: rgba(13, 17, 33, 0.7);
      --bg-glass-hover: rgba(22, 29, 56, 0.85);
      
      --primary-rgb: 0, 240, 255;
      --primary: rgb(var(--primary-rgb));
      --secondary-rgb: 255, 0, 127;
      --secondary: rgb(var(--secondary-rgb));
      --accent-rgb: 123, 31, 162;
      --accent: rgb(var(--accent-rgb));
      
      --neon-gold: #ffd700;
      --neon-green: #00ff88;
      --neon-red: #ff3366;
      
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      
      --border-glass: rgba(255, 255, 255, 0.12);
      --border-neon: rgba(var(--primary-rgb), 0.5);
      
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "Consolas", "Courier New", Courier, monospace;
      
      --glow-primary: 0 0 20px rgba(var(--primary-rgb), 0.4);
      --glow-secondary: 0 0 20px rgba(var(--secondary-rgb), 0.4);
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.theme-rgb-rainbow { --primary-rgb: 0, 240, 255; --secondary-rgb: 255, 0, 127; }
    body.theme-neon-blue { --primary-rgb: 0, 162, 255; --secondary-rgb: 0, 240, 255; }
    body.theme-cyber-purple { --primary-rgb: 170, 0, 255; --secondary-rgb: 255, 0, 170; }
    body.theme-emerald-glow { --primary-rgb: 0, 255, 136; --secondary-rgb: 0, 200, 255; }
    body.theme-crimson-flame { --primary-rgb: 255, 50, 50; --secondary-rgb: 255, 150, 0; }

    /* ==========================================================================
       2. RESET & BASE STYLES
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-deep-space);
      color: var(--text-main);
      font-family: var(--font-main);
      overflow-x: hidden;
      font-size: 14px;
      line-height: 1.5;
    }

    input, button, select, textarea {
      font-family: inherit;
      color: inherit;
      outline: none;
      border: none;
      background: none;
    }

    input[type="text"], input[type="password"], input[type="number"] {
      font-size: 16px !important;
      user-select: text;
    }

    /* ==========================================================================
       3. BACKGROUND ANIMATION & RGB EFFECTS
       ========================================================================== */
    #canvas-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .aurora-bg {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(var(--primary-rgb), 0.15), transparent 40%),
                  radial-gradient(circle at 80% 20%, rgba(var(--secondary-rgb), 0.12), transparent 35%),
                  radial-gradient(circle at 20% 80%, rgba(var(--accent-rgb), 0.15), transparent 40%);
      animation: auroraRotate 30s linear infinite;
    }

    @keyframes auroraRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.6;
    }

    /* ==========================================================================
       4. LOGIN GATE OVERLAY
       ========================================================================== */
    #login-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(3, 5, 13, 0.95);
      backdrop-filter: blur(20px);
      transition: opacity 0.6s ease, visibility 0.6s ease, transform 0.6s ease;
    }

    #login-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.08);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 35px 28px;
      background: rgba(13, 17, 33, 0.85);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glass);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), var(--glow-primary);
      text-align: center;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: var(--radius-lg);
      padding: 2px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent), var(--primary));
      background-size: 300% 300%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: rgbBorder 4s linear infinite;
    }

    @keyframes rgbBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 25px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      color: #fff;
      transition: var(--transition-fast);
    }

    .btn-login {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: var(--glow-primary);
      transition: var(--transition-fast);
    }
  </style>
</head>
<body>
  <div class="aurora-bg"></div>
  <canvas id="canvas-particles"></canvas>
  <div class="scanline"></div>

  <!-- LOGIN OVERLAY -->
  <div id="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <h1>👑 IGG VIP TOOL</h1>
        <p>Township VIP Control Center</p>
      </div>
      <div class="input-group">
        <label>Access Passkey</label>
        <div class="input-wrapper">
          <input type="password" id="passkey-input" placeholder="Enter VIP Passkey...">
        </div>
      </div>
      <button class="btn-login" id="btn-login-submit">UNLOCK DASHBOARD</button>
      <div class="login-error" id="login-error-msg"></div>
    </div>
  </div>
