<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👑 IGG VIP TOOL — Ultimate Control Center</title>
  <style>
    :root {
      --bg-space: #060913;
      --card-bg: rgba(15, 20, 32, 0.9);
      --card-border: rgba(255, 255, 255, 0.1);
      
      --rgb-cyan: #00f0ff;
      --rgb-magenta: #ff007f;
      --rgb-purple: #a000ff;
      --rgb-gold: #ffd700;
      --rgb-green: #00ff88;
      
      --text-muted: #8292ab;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body {
      background: var(--bg-space);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Animated Ambient RGB Background */
    body::before {
      content: '';
      position: fixed;
      top: -20%; left: -20%;
      width: 140%; height: 140%;
      background: radial-gradient(circle at 20% 20%, rgba(0, 240, 255, 0.08), transparent 40%),
                  radial-gradient(circle at 80% 80%, rgba(255, 0, 127, 0.08), transparent 40%),
                  radial-gradient(circle at 50% 50%, rgba(160, 0, 255, 0.06), transparent 50%);
      z-index: -1;
      animation: rotateGlow 20s linear infinite alternate;
    }
    @keyframes rotateGlow {
      0% { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(10deg) scale(1.05); }
    }

    /* Top Bar Header with Hamburger Button */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      height: 42px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .hamburger-btn {
      font-size: 1.4rem;
      color: var(--rgb-cyan);
      cursor: pointer;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: var(--radius-sm);
      padding: 2px 8px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }
    .brand-title {
      font-size: 1.1rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff, var(--rgb-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }
    .live-clock {
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--rgb-cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }

    /* Slide-out Sidebar Drawer Menu */
    .sidebar-drawer {
      position: fixed;
      top: 0; left: -280px;
      width: 270px; height: 100%;
      background: rgba(10, 14, 26, 0.96);
      border-right: 1px solid var(--rgb-cyan);
      box-shadow: 10px 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(0, 240, 255, 0.2);
      backdrop-filter: blur(20px);
      z-index: 1000;
      transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .sidebar-drawer.open { left: 0; }
    
    .sidebar-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 999;
      display: none;
      backdrop-filter: blur(3px);
    }
    .sidebar-overlay.active { display: block; }

    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      color: var(--rgb-gold);
      font-weight: 900;
      font-size: 1rem;
    }
    .drawer-close { cursor: pointer; color: var(--rgb-magenta); font-size: 1.2rem; }

    .menu-links { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
    .menu-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-sm);
      color: #fff; font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .menu-item:hover, .menu-item:active {
      border-color: var(--rgb-cyan);
      background: rgba(0, 240, 255, 0.1);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    /* 4 Side-By-Side Vertical Category Cards */
    .categories-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 8px 0;
      height: 70px;
    }
    .cat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: all 0.2s;
      overflow: hidden;
    }
    .cat-card.active {
      border-color: var(--rgb-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      background: rgba(0, 240, 255, 0.08);
    }
    .cat-card.active::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--rgb-cyan), var(--rgb-magenta), var(--rgb-gold));
    }
    .cat-card .icon { font-size: 1.1rem; margin-bottom: 2px; }
    .cat-card .title { font-size: 0.62rem; font-weight: 800; text-transform: uppercase; color: var(--text-muted); }
    .cat-card.active .title { color: #fff; }

    /* Features Section View (Compact) */
    .features-container {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 10px;
      overflow-y: auto;
      margin-bottom: 8px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    }
    .category-section { display: none; }
    .category-section.active { display: flex; flex-direction: column; gap: 6px; }

    /* Horizontal Feature Row Box */
    .horizontal-feature-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(8, 12, 22, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }
    .feature-left { display: flex; flex-direction: column; gap: 1px; }
    .feature-name {
      font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--rgb-cyan); display: flex; align-items: center; gap: 4px;
    }
    .feature-name.magenta { color: var(--rgb-magenta); }
    .feature-name.purple { color: var(--rgb-purple); }
    .feature-name.gold { color: var(--rgb-gold); }

    .feature-input {
      background: none; border: none; outline: none; color: #fff; font-size: 0.95rem; font-weight: 900; font-family: inherit; width: 130px;
    }

    .3d-toggle-box {
      width: 22px; height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--rgb-cyan), var(--rgb-purple));
      display: flex; align-items: center; justify-content: center;
      color: #000; font-size: 12px; font-weight: 900; cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }
    .3d-toggle-box.off { background: #1c2333; color: #526077; box-shadow: none; }

    /* Terminal Console Display (Fixed Height At Bottom) */
    .terminal-card {
      height: 140px;
      background: #04060c;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.15);
      font-family: 'Consolas', 'Courier New', monospace;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .terminal-header {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.68rem; color: var(--rgb-cyan); font-weight: bold;
      border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 4px;
    }
    .terminal-logs {
      flex: 1; overflow-y: auto; font-size: 0.7rem; display: flex; flex-direction: column; gap: 4px; margin: 4px 0;
    }
    .log-line { color: #8e9cb0; }
    .log-line.success { color: var(--rgb-green); }
    .log-line.warn { color: var(--rgb-gold); }
    
    .terminal-input-row {
      display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.03);
      padding: 4px 8px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.08);
    }
    .terminal-input-row span { color: var(--rgb-magenta); font-weight: bold; }
    .terminal-input-row input {
      width: 100%; background: none; border: none; outline: none; color: #fff; font-family: inherit; font-size: 0.72rem;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR OVERLAY & DRAWER MENU -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleDrawer()"></div>
  <div class="sidebar-drawer" id="sidebar-drawer">
    <div>
      <div class="drawer-header">
        <span>⚙️ MENU & OPTIONS</span>
        <span class="drawer-close" onclick="toggleDrawer()">✕</span>
      </div>
      <div class="menu-links">
        <div class="menu-item" onclick="openSettingModal('Settings')">⚙️ Settings</div>
        <div class="menu-item" onclick="openSettingModal('Languages')">🌐 Languages</div>
        <a class="menu-item" href="https://youtube.com" target="_blank">▶️ YouTube Channel</a>
        <a class="menu-item" href="https://t.me" target="_blank">✈️ Telegram Support</a>
        <div class="menu-item" onclick="openSettingModal('Theme Selector')">🎨 Theme Options</div>
      </div>
    </div>
    <div class="menu-item" style="border-color:var(--rgb-magenta); color:var(--rgb-magenta);" onclick="logout()">
      🚪 Logout Tool
    </div>
  </div>

  <!-- TOP HEADER -->
  <div class="header-bar">
    <div class="header-left">
      <div class="hamburger-btn" onclick="toggleDrawer()">☰</div>
      <div class="brand-title">👑 IGG VIP TOOL</div>
    </div>
    <div class="live-clock" id="clock-display">00:00:00</div>
  </div>

  <!-- 4 SIDE-BY-SIDE VERTICAL CATEGORY CARDS -->
  <div class="categories-row">
    <div class="cat-card active" onclick="selectCategory('cat-dash', this)">
      <div class="icon">🏠</div>
      <div class="title">Dashboard</div>
    </div>
    <div class="cat-card" onclick="selectCategory('cat-custom', this)">
      <div class="icon">👑</div>
      <div class="title">Custom</div>
    </div>
    <div class="cat-card" onclick="selectCategory('cat-gameplay', this)">
      <div class="icon">🧩</div>
      <div class="title">Gameplay</div>
    </div>
    <div class="cat-card" onclick="selectCategory('cat-supplies', this)">
      <div class="icon">🛒</div>
      <div class="title">Supplies</div>
    </div>
  </div>
