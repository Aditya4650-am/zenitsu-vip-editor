<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👑 IGG VIP TOOL — Ultimate Control Center</title>
  <style>
    :root {
      --bg-space: #060913;
      --card-bg: rgba(15, 20, 32, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      
      --rgb-cyan: #00f0ff;
      --rgb-magenta: #ff007f;
      --rgb-purple: #a000ff;
      --rgb-gold: #ffd700;
      --rgb-green: #00ff88;
      
      --text-muted: #8292ab;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body {
      background: var(--bg-space);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      font-size: 14px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated Ambient RGB Glow Background */
    body::before {
      content: '';
      position: fixed;
      top: -20%; left: -20%;
      width: 140%; height: 140%;
      background: radial-gradient(circle at 20% 20%, rgba(0, 240, 255, 0.08), transparent 40%),
                  radial-gradient(circle at 80% 80%, rgba(255, 0, 127, 0.08), transparent 40%),
                  radial-gradient(circle at 50% 50%, rgba(160, 0, 255, 0.06), transparent 50%);
      z-index: -1;
      animation: rotateGlow 20s linear infinite alternate;
    }
    @keyframes rotateGlow {
      0% { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(10deg) scale(1.05); }
    }

    /* Top Bar Header */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff, var(--rgb-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }
    .live-clock {
      font-family: monospace;
      font-size: 0.95rem;
      color: var(--rgb-cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }

    /* Vertical 3D Category Box */
    .vertical-category-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 22px;
      position: relative;
      /* 3D Depth Shadows */
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6),
                  inset 0 1px 1px rgba(255, 255, 255, 0.15),
                  0 0 15px rgba(0, 240, 255, 0.05);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    /* Animated RGB Line Top Accent */
    .vertical-category-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--rgb-cyan), var(--rgb-magenta), var(--rgb-gold), var(--rgb-cyan));
      background-size: 300% 100%;
      animation: rgbMove 4s linear infinite;
    }
    @keyframes rgbMove {
      0% { background-position: 0% 0%; }
      100% { background-position: 300% 0%; }
    }

    .category-header {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--rgb-gold);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Horizontal Feature Card Row */
    .horizontal-feature-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(8, 12, 22, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 10px;
      position: relative;
      /* 3D Pressed Card Effect */
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .horizontal-feature-row:last-child { margin-bottom: 0; }

    .horizontal-feature-row:active {
      transform: scale(0.98);
      border-color: rgba(0, 240, 255, 0.4);
    }

    .feature-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .feature-name {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--rgb-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .feature-name.magenta { color: var(--rgb-magenta); }
    .feature-name.purple { color: var(--rgb-purple); }
    .feature-name.gold { color: var(--rgb-gold); }

    .feature-input {
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 900;
      font-family: inherit;
      width: 140px;
    }

    .feature-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Custom 3D RGB Checkmark Box Switcher */
    .3d-toggle-box {
      width: 26px; height: 26px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--rgb-cyan), var(--rgb-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: all 0.2s;
    }
    .3d-toggle-box.off {
      background: #1c2333;
      color: #526077;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* Terminal Console Display */
    .terminal-card {
      background: #04060c;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.15);
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--rgb-cyan);
      font-weight: bold;
      margin-bottom: 12px;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
      padding-bottom: 8px;
    }
    .terminal-logs {
      height: 120px;
      overflow-y: auto;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .log-line { color: #8e9cb0; }
    .log-line.success { color: var(--rgb-green); }
    .log-line.warn { color: var(--rgb-gold); }
    
    .terminal-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      background: rgba(255,255,255,0.03);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .terminal-input-row span { color: var(--rgb-magenta); font-weight: bold; }
    .terminal-input-row input {
      width: 100%; background: none; border: none; outline: none; color: #fff; font-family: inherit; font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-bar">
    <div class="brand-title">👑 IGG VIP TOOL</div>
    <div class="live-clock" id="clock-display">00:00:00</div>

  <!-- CATEGORY 1: DASHBOARD & CURRENCIES -->

    <div class="horizontal-feature-row">

    <div class="horizontal-feature-row">

    <div class="horizontal-feature-row">

    <div class="horizontal-feature-row">

  </div>
